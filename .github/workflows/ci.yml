name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev \
            libgl1-mesa-dev libxkbcommon-dev libxcb-cursor-dev \
            libxcb-cursor0 libxkbcommon-x11-0

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Host tests
        run: cmake --build build --target pkhex-qt-host-tests && ctest --test-dir build --output-on-failure

      - name: Editor tests
        run: dotnet test tests/byte-parity/PKHeX.ByteParity.Tests.csproj --nologo
