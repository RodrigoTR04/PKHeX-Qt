name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev \
            libgl1-mesa-dev libxkbcommon-dev libxcb-cursor-dev \
            libxcb-cursor0 libxkbcommon-x11-0 \
            wget imagemagick patchelf

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPKHEXQT_SELF_CONTAINED=ON

      - name: Build Host
        run: cmake --build build --target pkhex-qt

      - name: Host smoke
        run: cmake --build build --target pkhex-qt-host-tests && ctest --test-dir build --output-on-failure

      - name: Editor tests
        run: dotnet test tests/byte-parity/PKHeX.ByteParity.Tests.csproj -c Release --nologo

      - name: Pack linux-x64 folder
        run: host/scripts/pack-release.sh build/host dist/pkhex-qt-linux-x64

      - name: Check folder artifact
        run: host/scripts/check-release.sh dist/pkhex-qt-linux-x64

      - name: Pack AppImage
        run: host/scripts/pack-appimage.sh dist/pkhex-qt-linux-x64 dist/PKHeX_Qt-x86_64.AppImage

      - name: Check AppImage
        run: host/scripts/check-appimage.sh dist/PKHeX_Qt-x86_64.AppImage

      - name: Launch AppImage without a .NET SDK
        run: |
          unset DOTNET_ROOT
          export PATH=/usr/bin:/bin
          export QT_QPA_PLATFORM=offscreen
          export APPIMAGE_EXTRACT_AND_RUN=1
          set +e
          timeout 8 dist/PKHeX_Qt-x86_64.AppImage
          status=$?
          set -e
          if [ "$status" -eq 124 ] || [ "$status" -eq 0 ]; then
            exit 0
          fi
          echo "AppImage host exited $status"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: PKHeX_Qt-x86_64.AppImage
          path: dist/PKHeX_Qt-x86_64.AppImage

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/PKHeX_Qt-x86_64.AppImage \
            --title "PKHeX Qt $GITHUB_REF_NAME" \
            --prerelease \
            --notes "Incomplete public build. This is not v1.

          Linux x86_64 AppImage. chmod +x PKHeX_Qt-x86_64.AppImage and run it. Ships a self-contained .NET 10 runtime, Qt 6, and ICU. No .NET SDK and no distro Qt package.

          Built on Ubuntu 24.04 (glibc 2.39 or newer). Uses X11 / XWayland. If the file does nothing, run APPIMAGE_EXTRACT_AND_RUN=1 ./PKHeX_Qt-x86_64.AppImage (Ubuntu 24.04 has no libfuse2).

          Open, edit, and save work. Subforms are still missing. GPL-3.0-or-later. Source is this tag."
